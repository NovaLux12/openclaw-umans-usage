name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # openclaw is not a locked devDependency (its published npm-shrinkwrap.json
      # pins a transitive dependency tree we cannot patch). Install it ad hoc so
      # `openclaw/plugin-sdk/*` types resolve for tsc.
      - run: npm install openclaw@2026.7.1 --no-save --no-audit --no-fund
      - run: npx tsc --noEmit
      # The test exercises the BUILT artifact: `src/usage.test.ts` imports
      # `../dist/usage.js`, because `dist` is what the plugin actually ships
      # (`package.json`'s `files` allowlist is `dist`, `openclaw.plugin.json`,
      # `README.md`). The build used to be a no-op here only because `dist/`
      # was committed to the repository, which meant CI was testing whatever
      # stale build happened to be checked in rather than the current source.
      # With `dist/` untracked, CI has to build it.
      - run: npm run build
      - run: npm test
