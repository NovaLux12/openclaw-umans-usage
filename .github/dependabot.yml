version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # openclaw is deliberately NOT a locked devDependency (npm-shrinkwrap.json in
    # the published package means overrides cannot patch its subtree, and its
    # vulnerable transitive deps made every Dependabot security-update job fail).
    # CI installs it ad hoc with --no-save; see .github/workflows/ci.yml.
